[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet-review"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp==2.3.0", "dulwich==1.2.17", "pydantic==2.14.1"]
codex = ["mcp==2.3.0", "dulwich==1.2.17", "pydantic==2.14.1", "openai-codex==0.163.0"]

[project.scripts]
gauntlet-mcp = "gauntlet_review.collaborative.server:main"
gauntlet-codex = "gauntlet_review.codex_bridge.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gauntlet_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
